name: Deploy Supabase staging migrations

on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: "Confirmed staging project reference"
        required: true
        type: string
      confirmation:
        description: "Type APPLY_TO_STAGING to authorize schema changes"
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy-staging:
    name: Apply and verify staging migrations
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PROJECT_REF: ${{ inputs.project_ref }}
      CONFIRMATION: ${{ inputs.confirmation }}

    steps:
      - name: Check out backend development branch
        uses: actions/checkout@v4
        with:
          ref: feat/backend-foundation

      - name: Set up Supabase CLI on GitHub runner
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Validate target and explicit confirmation
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_DB_URL:-}" ]]; then
            echo "::error::SUPABASE_DB_URL secret is missing."
            exit 1
          fi
          if [[ ! "$PROJECT_REF" =~ ^[a-z0-9]{20}$ ]]; then
            echo "::error::Project reference must be exactly 20 lowercase letters or numbers."
            exit 1
          fi
          if [[ "$CONFIRMATION" != "APPLY_TO_STAGING" ]]; then
            echo "::error::Type APPLY_TO_STAGING in the confirmation field to proceed."
            exit 1
          fi
          if [[ "$SUPABASE_DB_URL" != postgres://* && "$SUPABASE_DB_URL" != postgresql://* ]]; then
            echo "::error::SUPABASE_DB_URL must be a PostgreSQL connection URI."
            exit 1
          fi
          if [[ "$SUPABASE_DB_URL" != *"$PROJECT_REF"* ]]; then
            echo "::error::The database URI does not contain the supplied project reference."
            exit 1
          fi
          CONFIG_PROJECT_REF="$(sed -n 's/^project_id = "\(.*\)"/\1/p' supabase/config.toml)"
          if [[ "$CONFIG_PROJECT_REF" != "$PROJECT_REF" ]]; then
            echo "::error::supabase/config.toml does not match the supplied project reference."
            exit 1
          fi
          echo "Target reference and confirmation validated. No secret values were printed."

      - name: Re-check migration history
        run: supabase migration list --db-url "$SUPABASE_DB_URL"

      - name: Preview all pending migrations
        run: supabase db push --dry-run --db-url "$SUPABASE_DB_URL"

      - name: Confirm the staging database is still empty
        shell: bash
        run: |
          set -euo pipefail
          SQL=$(cat <<'SQL'
          SELECT CASE
            WHEN (SELECT count(*) FROM auth.users) = 0
              AND to_regclass('public.profiles') IS NULL
              AND to_regclass('public.user_roles') IS NULL
              AND to_regclass('public.organizations') IS NULL
              AND to_regclass('public.organization_members') IS NULL
              AND to_regclass('public.departments') IS NULL
              AND to_regclass('public.teams') IS NULL
              AND to_regclass('public.locations') IS NULL
              AND to_regclass('public.geofences') IS NULL
              AND to_regclass('public.attendance_records') IS NULL
              AND to_regclass('public.attendance_events') IS NULL
              AND to_regclass('public.tasks') IS NULL
              AND to_regclass('public.task_comments') IS NULL
              AND to_regclass('public.task_status_history') IS NULL
              AND to_regclass('public.audit_logs') IS NULL
              AND to_regtype('public.app_role') IS NULL
              AND NOT EXISTS (
                SELECT 1 FROM pg_trigger t
                WHERE t.tgrelid = 'auth.users'::regclass
                  AND t.tgname = 'on_auth_user_created'
                  AND NOT t.tgisinternal
              )
            THEN 'STAGING_GUARD_PASS'
            ELSE 'STAGING_GUARD_FAIL'
          END AS deployment_guard;
          SQL
          )
          RESULT="$(supabase db query "$SQL" --db-url "$SUPABASE_DB_URL" --read-only --output table)"
          echo "$RESULT"
          if ! grep -q "STAGING_GUARD_PASS" <<< "$RESULT"; then
            echo "::error::The staging database is no longer empty or has conflicting application objects. No migrations were applied."
            exit 1
          fi

      - name: Apply reviewed migrations to the confirmed staging database
        run: supabase db push --yes --db-url "$SUPABASE_DB_URL"

      - name: Verify backend schema, RLS and privileged grants
        shell: bash
        run: |
          set -euo pipefail
          # Use the PostgreSQL connection URI directly for verification.
          # Supabase CLI db query does not accept --db-url as a target flag.
          bun add --no-save postgres
          cat > /tmp/verify_backend.ts <<'TS'
          import postgres from "postgres";
          const url = process.env.SUPABASE_DB_URL;
          if (!url) throw new Error("SUPABASE_DB_URL is missing");
          const sql = postgres(url, { max: 1, connect_timeout: 15 });
          try {
            const checks = await sql.unsafe(`
              SELECT
                required.table_name,
                to_regclass(format('public.%I', required.table_name)) IS NOT NULL AS present,
                coalesce(c.relrowsecurity, false) AS rls_enabled
              FROM (VALUES
                ('organizations'), ('organization_members'), ('departments'),
                ('teams'), ('locations'), ('geofences'), ('attendance_records'),
                ('attendance_events'), ('tasks'), ('task_comments'),
                ('task_status_history'), ('audit_logs'), ('profiles'), ('user_roles')
              ) AS required(table_name)
              LEFT JOIN pg_class c
                ON c.oid = to_regclass(format('public.%I', required.table_name))
              ORDER BY required.table_name
            `);
            console.log("TABLE AND RLS CHECKS");
            console.table(checks);
            const missing = checks.filter((row: any) => !row.present);
            const noRls = checks.filter((row: any) => row.present && !row.rls_enabled && row.table_name !== "profiles" && row.table_name !== "user_roles");
            if (missing.length || noRls.length) {
              throw new Error(`Missing tables: ${missing.map((x: any) => x.table_name).join(", ") || "none"}; tables without RLS: ${noRls.map((x: any) => x.table_name).join(", ") || "none"}`);
            }

            const funcs = await sql.unsafe(`
              SELECT name, to_regprocedure(signature) IS NOT NULL AS present
              FROM (VALUES
                ('get_my_organization_memberships', 'public.get_my_organization_memberships()'),
                ('get_organization_directory', 'public.get_organization_directory(uuid)'),
                ('get_my_attendance_today', 'public.get_my_attendance_today(uuid)'),
                ('get_my_tasks', 'public.get_my_tasks(uuid)'),
                ('get_organization_assignees', 'public.get_organization_assignees(uuid)'),
                ('get_organization_dashboard', 'public.get_organization_dashboard(uuid)'),
                ('record_attendance_event', 'public.record_attendance_event(uuid,uuid,text,timestamptz,double precision,double precision,double precision,uuid,text,text,text,jsonb,date)'),
                ('create_task_with_audit', 'public.create_task_with_audit(uuid,text,text,uuid,uuid,timestamptz,text)'),
                ('apply_task_transition', 'public.apply_task_transition(uuid,uuid,uuid,text,text,text)')
              ) AS required(name, signature)
              ORDER BY name
            `);
            console.log("RPC CHECKS");
            console.table(funcs);
            const missingFns = funcs.filter((row: any) => !row.present);
            if (missingFns.length) throw new Error(`Missing RPCs: ${missingFns.map((x: any) => x.name).join(", ")}`);

            const hardening = await sql.unsafe(`
              SELECT
                NOT EXISTS (
                  SELECT 1 FROM information_schema.role_table_grants
                  WHERE table_schema = 'public' AND table_name = 'organization_members'
                    AND grantee IN ('anon','authenticated')
                    AND privilege_type IN ('INSERT','UPDATE','DELETE','TRUNCATE','REFERENCES','TRIGGER')
                ) AS membership_browser_writes_revoked,
                NOT EXISTS (
                  SELECT 1 FROM pg_policies
                  WHERE schemaname = 'public' AND tablename = 'organization_members'
                    AND cmd IN ('ALL','INSERT','UPDATE','DELETE')
                ) AS membership_browser_write_policies_absent,
                NOT has_function_privilege(
                  'authenticated',
                  'public.record_attendance_event(uuid,uuid,text,timestamptz,double precision,double precision,double precision,uuid,text,text,text,jsonb,date)',
                  'EXECUTE'
                ) AS attendance_rpc_not_browser_executable,
                has_function_privilege(
                  'service_role',
                  'public.record_attendance_event(uuid,uuid,text,timestamptz,double precision,double precision,double precision,uuid,text,text,text,jsonb,date)',
                  'EXECUTE'
                ) AS attendance_rpc_service_role_executable,
                NOT has_function_privilege('authenticated', 'public.create_task_with_audit(uuid,text,text,uuid,uuid,timestamptz,text)', 'EXECUTE')
                  AND NOT has_function_privilege('authenticated', 'public.apply_task_transition(uuid,uuid,uuid,text,text,text)', 'EXECUTE')
                  AS task_write_rpcs_not_browser_executable,
                EXISTS (
                  SELECT 1 FROM pg_trigger t
                  WHERE t.tgrelid = 'auth.users'::regclass
                    AND t.tgname = 'on_auth_user_confirmed_activate_memberships'
                    AND NOT t.tgisinternal
                ) AS membership_activation_trigger_present
            `);
            console.log("SECURITY CHECKS");
            console.table(hardening);
            const security = hardening[0] as Record<string, boolean>;
            const failed = Object.entries(security).filter(([, pass]) => pass !== true);
            if (failed.length) throw new Error(`Security checks failed: ${failed.map(([key]) => key).join(", ")}`);
            console.log("PASS: backend tables, RLS, RPCs and security grants verified.");
          } finally {
            await sql.end();
          }
          TS
          bun run /tmp/verify_backend.ts

      - name: Confirm no pending migrations remain
        run: |
          supabase migration list --db-url "$SUPABASE_DB_URL"
          supabase db push --dry-run --db-url "$SUPABASE_DB_URL"

      - name: Deployment summary
        run: echo "Staging migrations were applied and the repository verification script completed. Edge Functions were not deployed."
