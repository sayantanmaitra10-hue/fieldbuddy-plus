name: Deploy FieldBuddy task action to staging

on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: "Confirmed Supabase staging project reference"
        required: true
        default: "jrmwkdputphprscfomxc"
        type: string
      confirmation:
        description: "Type DEPLOY_TASK_ACTION_TO_STAGING to authorize deployment"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fieldbuddy-supabase-staging-task-action
  cancel-in-progress: false

jobs:
  deploy-task-action:
    name: Deploy task-action Edge Function to staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PROJECT_REF: ${{ inputs.project_ref }}
      CONFIRMATION: ${{ inputs.confirmation }}

    steps:
      - name: Check out reviewed backend development branch
        uses: actions/checkout@v4
        with:
          ref: feat/backend-foundation

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Validate exact staging target and authorization
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_REF="jrmwkdputphprscfomxc"
          if [[ -z "${SUPABASE_ACCESS_TOKEN:-}" || -z "${SUPABASE_DB_URL:-}" ]]; then
            echo "::error::Required Supabase GitHub Actions secrets are missing."
            exit 1
          fi
          if [[ "$PROJECT_REF" != "$EXPECTED_REF" || "$SUPABASE_DB_URL" != *"$EXPECTED_REF"* ]]; then
            echo "::error::Only the confirmed staging project is permitted."
            exit 1
          fi
          if [[ "$CONFIRMATION" != "DEPLOY_TASK_ACTION_TO_STAGING" ]]; then
            echo "::error::The deployment confirmation phrase is incorrect."
            exit 1
          fi
          CONFIG_PROJECT_REF="$(sed -n 's/^project_id = "\(.*\)"/\1/p' supabase/config.toml)"
          if [[ "$CONFIG_PROJECT_REF" != "$EXPECTED_REF" ]]; then
            echo "::error::The repository Supabase config does not match staging."
            exit 1
          fi
          test -f supabase/functions/task-action/index.ts
          echo "Target and authorization verified. No secret values printed."

      - name: Deploy task-action only
        run: supabase functions deploy task-action --project-ref "$PROJECT_REF" --yes

      - name: Deployment summary
        run: echo "The task-action Edge Function was deployed to the confirmed staging project. No other functions, migrations or application data were changed."
