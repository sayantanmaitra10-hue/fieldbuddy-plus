name: FieldBuddy CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type check
        run: bunx tsc -b --pretty false
      - name: Build
        run: bun run build
      - name: Unit tests
        run: bun run test
