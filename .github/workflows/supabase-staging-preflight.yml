name: Supabase staging preflight

on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: "Confirmed STAGING Supabase project reference (20 lowercase letters/numbers)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  inspect-staging:
    name: Read-only staging inspection
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ inputs.project_ref }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI on GitHub runner
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Validate credentials and staging project reference
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_ACCESS_TOKEN:-}" ]]; then
            echo "::error::Add SUPABASE_ACCESS_TOKEN under repository Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [[ -z "${SUPABASE_DB_PASSWORD:-}" ]]; then
            echo "::error::Add SUPABASE_DB_PASSWORD under repository Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [[ ! "$PROJECT_REF" =~ ^[a-z0-9]{20}$ ]]; then
            echo "::error::Project reference must be exactly 20 lowercase letters or numbers."
            exit 1
          fi
          echo "Preflight target project ref: $PROJECT_REF"
          echo "No database writes or deployments will be performed by this workflow."

      - name: Link the selected project in this temporary runner
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Compare local and remote migration history
        run: supabase migration list --remote

      - name: Preview migrations without applying them
        run: supabase db push --dry-run --remote

      - name: Check required legacy application columns (read-only)
        shell: bash
        run: |
          set -euo pipefail
          SQL=$(cat <<'SQL'
          WITH required_columns(table_name, column_name) AS (
            VALUES
              ('profiles', 'id'),
              ('profiles', 'display_name'),
              ('profiles', 'employee_id'),
              ('profiles', 'avatar_url'),
              ('profiles', 'phone'),
              ('user_roles', 'user_id')
          )
          SELECT
            required_columns.table_name,
            required_columns.column_name,
            EXISTS (
              SELECT 1
              FROM information_schema.columns c
              WHERE c.table_schema = 'public'
                AND c.table_name = required_columns.table_name
                AND c.column_name = required_columns.column_name
            ) AS present
          FROM required_columns
          ORDER BY required_columns.table_name, required_columns.column_name;
          SQL
          )
          supabase db query "$SQL" --read-only --remote --output table

      - name: List current public RLS policies (read-only)
        shell: bash
        run: |
          set -euo pipefail
          SQL=$(cat <<'SQL'
          SELECT
            schemaname,
            tablename,
            policyname,
            roles,
            cmd
          FROM pg_policies
          WHERE schemaname = 'public'
          ORDER BY tablename, policyname;
          SQL
          )
          supabase db query "$SQL" --read-only --remote --output table

      - name: Confirm no deployment was performed
        run: echo "Preflight complete. Review this run's migration preview, required-column results, and RLS policy listing before any separate deployment approval."
