name: Supabase staging preflight

on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: "Confirmed STAGING Supabase project reference (20 lowercase letters/numbers)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  inspect-staging:
    name: Read-only staging inspection
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PROJECT_REF: ${{ inputs.project_ref }}

    steps:
      - name: Check out backend development branch
        uses: actions/checkout@v4
        with:
          ref: feat/backend-foundation

      - name: Set up Supabase CLI on GitHub runner
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Validate database connection string and target
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_DB_URL:-}" ]]; then
            echo "::error::Add SUPABASE_DB_URL under repository Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [[ ! "$PROJECT_REF" =~ ^[a-z0-9]{20}$ ]]; then
            echo "::error::Project reference must be exactly 20 lowercase letters or numbers."
            exit 1
          fi
          if [[ "$SUPABASE_DB_URL" != postgres://* && "$SUPABASE_DB_URL" != postgresql://* ]]; then
            echo "::error::SUPABASE_DB_URL must be the PostgreSQL URI copied from the Supabase Dashboard Connect dialog."
            exit 1
          fi
          if [[ "$SUPABASE_DB_URL" == *"[YOUR-PASSWORD]"* || "$SUPABASE_DB_URL" == *"YOUR_PASSWORD"* ]]; then
            echo "::error::SUPABASE_DB_URL still contains the literal password placeholder. Replace it with the staging database password in the GitHub secret."
            exit 1
          fi
          if [[ "$SUPABASE_DB_URL" != *"$PROJECT_REF"* ]]; then
            echo "::error::SUPABASE_DB_URL does not contain the project reference entered for this run. In the Supabase Connect dialog, select Session pooler and copy the complete URI. Its username should look like postgres.PROJECT_REF."
            exit 1
          fi
          echo "Connection string format and project reference checks passed."
          echo "The next steps connect directly to Postgres. They do not call supabase link or the Supabase Management API."

      - name: Compare local and remote migration history (read-only)
        run: supabase migration list --db-url "$SUPABASE_DB_URL"

      - name: Preview migrations without applying them
        run: supabase db push --dry-run --db-url "$SUPABASE_DB_URL"

      - name: Check required legacy application columns (read-only)
        shell: bash
        run: |
          set -euo pipefail
          SQL=$(cat <<'SQL'
          WITH required_columns(table_name, column_name) AS (
            VALUES
              ('profiles', 'id'),
              ('profiles', 'display_name'),
              ('profiles', 'employee_id'),
              ('profiles', 'avatar_url'),
              ('profiles', 'phone'),
              ('user_roles', 'user_id')
          )
          SELECT
            required_columns.table_name,
            required_columns.column_name,
            EXISTS (
              SELECT 1
              FROM information_schema.columns c
              WHERE c.table_schema = 'public'
                AND c.table_name = required_columns.table_name
                AND c.column_name = required_columns.column_name
            ) AS present
          FROM required_columns
          ORDER BY required_columns.table_name, required_columns.column_name;
          SQL
          )
          supabase db query "$SQL" --db-url "$SUPABASE_DB_URL" --read-only --output table

      - name: List current public RLS policies (read-only)
        shell: bash
        run: |
          set -euo pipefail
          SQL=$(cat <<'SQL'
          SELECT
            schemaname,
            tablename,
            policyname,
            roles,
            cmd
          FROM pg_policies
          WHERE schemaname = 'public'
          ORDER BY tablename, policyname;
          SQL
          )
          supabase db query "$SQL" --db-url "$SUPABASE_DB_URL" --read-only --output table

      - name: Confirm no deployment was performed
        run: echo "Preflight complete. Migration history, dry-run preview, required columns, and existing RLS policies were inspected. No changes were applied."
